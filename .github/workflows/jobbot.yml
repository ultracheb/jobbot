name: jobbot

on:
  schedule:
    - cron: "*/15 * * * *"   # кожныя 15 хв чытае каманды; вакансіі шукае раз на інтэрвал з налад (па змаўчанні гадзіна)
  workflow_dispatch: {}

concurrency:
  group: jobbot
  cancel-in-progress: false

permissions:
  contents: write            # толькі для рэдкага keepalive-каміта

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/jobbot.db
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State (settings, already-sent jobs, Telegram offset) lives in the Actions cache,
      # not in the repo, so nothing personal is public.
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/jobbot.db
          key: jobbot-state-${{ github.run_id }}
          restore-keys: jobbot-state-

      - name: Run bot
        run: python run_once.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/jobbot.db
          key: jobbot-state-${{ github.run_id }}

      # Public repos get scheduled workflows disabled after 60 days without repo activity.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "jobbot"
            git config user.email "jobbot@users.noreply.github.com"
            date -u +%F > .keepalive
            git add .keepalive
            git commit -q -m "keepalive $(date -u +%F)"
            git push -q
          fi
